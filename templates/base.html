<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Nexus — discover Android apps and Windows software.">
<title>{% block title %}Nexus — App Store{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="logo">N</span> Nexus</a><nav><a href="{{ url_for('index') }}">Explore</a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header>
<main class="wrap">{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>© {{ 2026 }} Nexus · Download responsibly and verify files before installing.</footer></body></html>
