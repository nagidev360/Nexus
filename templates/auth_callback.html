{% extends "base.html" %}{% block title %}Account — Nexus{% endblock %}{% block content %}<section class="form-card narrow auth-card"><div class="login-mark">N<span>.</span></div><div class="eyebrow">SECURE AUTHENTICATION</div><h1>Signing you in…</h1><p class="muted" id="callbackMessage">Please wait while Nexus confirms your account.</p></section><script>document.addEventListener("DOMContentLoaded",async()=>{const c=window.nexusSupabase;const message=document.getElementById("callbackMessage");if(!c){message.textContent="Authentication is not configured. Return to login and try again.";return}let redirected=false;const finish=()=>{if(!redirected){redirected=true;history.replaceState({},document.title,location.pathname);location.replace("/profile")}};c.auth.onAuthStateChange((event,session)=>{if(session&&(event==="SIGNED_IN"||event==="INITIAL_SESSION"))finish()});const {data,error}=await c.auth.getSession();if(error){message.textContent="Sign-in could not be completed: "+error.message;return}if(data?.session){finish();return}message.textContent="No active session was found. Please return to login and try again.";setTimeout(()=>{if(!redirected)location.replace("/login")},1800)});</script>{% endblock %}
